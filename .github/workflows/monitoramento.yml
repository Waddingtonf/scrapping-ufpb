name: Monitor SIPAC UFPB

on:
  schedule:
    # Roda a cada 6 horas (ajuste conforme necessário)
    # Sintaxe Cron: minuto hora dia mes dia_da_semana
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando num botão na aba Actions

jobs:
  check_sipac:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar Script de Monitoramento
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_REMETENTE: ${{ secrets.SENHA_REMETENTE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python main.py
